name: Build and Push Docker Image to DigitalOcean

on:
  push:
    branches:
      - RELEASE-PREPROD-2025

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone faster checkout

      # import submodule if present
      - name: See Submodule
        run: git submodule status

      - name: Set up Git to use PAT for authentication
        run: |
          git config --global url."https://${{ secrets.ACTIONS_DEPLOY_KEY }}@github.com/".insteadOf "https://github.com/"
          
      - name: Verify Submodule
        run: git submodule update --init

      # Set up Docker Buildx for BuildKit support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: |
            image=moby/buildkit:master
            network=host

      # Cache Docker layers and BuildKit caches (local)
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.ref_name }}-
            ${{ runner.os }}-buildx-
      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.PROD_DOCKER_REGISTRY }}
          username: ${{ secrets.PROD_DOCKER_USERNAME }}
          password: ${{ secrets.PROD_DOCKER_ACCESS_TOKEN }}

      # Build and push Docker image with remote cache
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.PROD_DOCKER_REGISTRY }}/talko-service:preprodlatest
          cache-from: |
            type=local,src=/tmp/.buildx-cache
            type=registry,ref=${{ secrets.PROD_DOCKER_REGISTRY }}/talko-service:build-cache-${{ github.ref_name }}
          cache-to: |
            type=registry,ref=${{ secrets.PROD_DOCKER_REGISTRY }}/talko-service:build-cache-${{ github.ref_name }},mode=max
          build-args: |
            VERSION=latest
          outputs: type=image,name=${{ secrets.PROD_DOCKER_REGISTRY }}/talko-service,push=true
          labels: |
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      # Clean up Docker logout
      - name: Logout from DigitalOcean Registry
        if: always()
        run: docker logout ${{ secrets.PROD_DOCKER_REGISTRY }}
