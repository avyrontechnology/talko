name: Build and Push to DOCR (talko)

# Pushes the talko image to DigitalOcean Container Registry on main / tags.
# Complements ecr-push.yml (AWS) — keep both, deploy to either cloud.
#
# Required GitHub secrets:
#   DIGITALOCEAN_ACCESS_TOKEN   DO API token with registry read/write
#   DOCR_REGISTRY               e.g. registry.digitalocean.com/avyron
#   DOCR_REPOSITORY             e.g. talko-service (defaults to talko-service)
#   ACTIONS_DEPLOY_KEY          PAT for private submodule digital_assets (existing secret)
#
# Required DO setup (one-time):
#   doctl registry create avyron   # must match DOCR_REGISTRY suffix

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  DOCR_REGISTRY: ${{ secrets.DOCR_REGISTRY || 'registry.digitalocean.com/avyron' }}
  DOCR_REPOSITORY: ${{ secrets.DOCR_REPOSITORY || 'talko-service' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.ACTIONS_DEPLOY_KEY || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DOCR
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCR_REGISTRY }}/${{ env.DOCR_REPOSITORY }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Logout from DOCR
        if: always()
        run: docker logout registry.digitalocean.com
