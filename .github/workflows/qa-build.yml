name: Build and Push Docker Image to DigitalOcean

on:
  push:
    branches:
      - feature--qa--2025

jobs:
  build:
    name: Initial build
    runs-on: ubuntu-latest
    env:
      MY_SECRET: ${{ secrets.ENV }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Check Python and Poetry Versions
        run: |
          python --version
          poetry --version

      - name: List Directory Contents
        run: ls -R

      - name: See Submodule
        run: git submodule status

      - name: Set up Git to use PAT for authentication
        run: |
          git config --global url."https://${{ secrets.ACTIONS_DEPLOY_KEY }}@github.com/".insteadOf "https://github.com/"

      - name: Verify Submodule
        run: git submodule update --init

      - name: Cache Poetry and pip dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Install flake8
        run: poetry run pip install flake8

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          poetry run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics


  build-and-push:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone for faster checkout

      # import submodule if present
      - name: See Submodule
        run: git submodule status

      - name: Set up Git to use PAT for authentication
        run: |
          git config --global url."https://${{ secrets.ACTIONS_DEPLOY_KEY }}@github.com/".insteadOf "https://github.com/"
          
      - name: Verify Submodule
        run: git submodule update --init

      # Set up Docker Buildx for BuildKit support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: |
            image=moby/buildkit:master
            network=host

      # Cache Docker layers and BuildKit caches (local)
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.ref_name }}-
            ${{ runner.os }}-buildx-
      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # Build and push Docker image with remote cache
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/talko-service:qalatest
          cache-from: |
            type=local,src=/tmp/.buildx-cache
            type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/talko-service:build-cache-${{ github.ref_name }}
          cache-to: |
            type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/talko-service:build-cache-${{ github.ref_name }},mode=max
          build-args: |
            VERSION=latest
          outputs: type=image,name=${{ secrets.DOCKER_REGISTRY }}/talko-service,push=true
          labels: |
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      # Clean up Docker logout
      - name: Logout from DigitalOcean Registry
        if: always()
        run: docker logout ${{ secrets.DOCKER_REGISTRY }}
