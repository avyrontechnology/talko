name: Build

on:
  push:
    branches: [non-exist-branch]
  pull_request:
    types: []

jobs:
  test:
    name: Initial build
    runs-on: ubuntu-latest
    env:
      MY_SECRET: ${{ secrets.ENV }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Check Python and Poetry Versions
        run: |
          python --version
          poetry --version

      - name: List Directory Contents
        run: ls -R

      - name: See Submodule
        run: git submodule status

      - name: Set up Git to use PAT for authentication
        run: |
          git config --global url."https://${{ secrets.ACTIONS_DEPLOY_KEY }}@github.com/".insteadOf "https://github.com/"

      - name: Verify Submodule
        run: git submodule update --init

      - name: Cache Poetry and pip dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Run Tests with Coverage
        run: |
          poetry run coverage run --source src -m pytest -v || echo "Tests failed, but proceeding to generate coverage report..."

      - name: Generate Coverage Report
        run: |
          poetry run coverage xml -o coverage.xml --ignore-errors
          poetry run coverage report -m --ignore-errors || true
          ls -la

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

