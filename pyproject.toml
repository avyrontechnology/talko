[tool.poetry]
name = "fastapi-template"
version = "0.1.0"
description = ""
authors = ["Aditya Tripathi <aditya.tripathi@affinityeducation.in>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.8"
dependency-injector = "^4.45.0"
sqlalchemy = "^2.0.38"
starlette-context = "^0.3.6"
uvicorn = "^0.34.0"
celery = "^5.4.0"
pydantic-settings = "^2.7.1"
redis = "^5.2.1"
asyncpg = "^0.30.0"
grpcio-tools = "^1.73.0"
motor = "^3.7.1"
httpx = "^0.28.1"
pyjwt = "^2.10.1"
cryptography = "^45.0.6"
aiohttp = "^3.12.15"
pytz = "^2025.2"
boto3 = "^1.35.84"
cloudinary = "^1.46.2"
python-multipart = "^0.0.20"
email-validator = "^2.3.0"
psutil = "^7.2.2"
livekit = "^1.1.7"
livekit-api = "^1.1.0"


[tool.poetry.group.dev.dependencies]
coverage = "^7.9.2"
pytest = "^8.4.1"
pytest-asyncio = "^1.0.0"
asgi-lifespan = "^2.1.0"
websockets = "^16.0"
ruff = "^0.16.0"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "venv",
    ".venv",
    "src/pub",
    "src/protos",
]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E4",  # pycodestyle errors (syntax/logic, not style)
    "E7",
    "E9",
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (except UP042: str+Enum mixin is required for Mongo storage)
]
# NOTE: E501 (line-too-long) intentionally not gated — 148 legacy long
# log-lines predate the standard; formatter already caps code layout.
# Clean up opportunistically; do not add new >120 lines.
ignore = [
    "B008",  # function-call-in-default-argument (Depends(...) pattern is idiomatic FastAPI)
    "B017",  # assert-raises-exception (pytest.raises(Exception) used deliberately in tests)
    "B904",  # raise-without-from (implicit __context__ preserved; deliberate re-raise style)
    "UP042",  # replace-str-enum (str+Enum mixin required for Mongo/pydantic compat)
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
