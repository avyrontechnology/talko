syntax = "proto3";

package auth;

// The authentication service definition.
service AuthService {
    // RPC to validate a token and return user information.
    rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);

    // Centralized Talko login: console verifies credentials, returns profile.
    rpc TalkoLogin (TalkoLoginRequest) returns (TalkoLoginResponse);

    // RPC to get the list of child users for a given user.
    rpc GetUserChildHierarchy (GetUserChildHierarchyRequest) returns (GetUserChildHierarchyResponse);

    // RPC to get the list of child users for a given user along with their directory information.
    rpc GetUserChildDetails (GetUserChildDetailsRequest) returns (GetUserChildDetailsResponse);

    //add GRPC method to get CurrentUserDetails.
    rpc GetUserDetails (GetUserDetailsRequest) returns (GetUserDetailsResponse);


    // RPC to get list of permission for given user.
    rpc GetUserPermissions (GetUserPermissionsRequest) returns (GetUserPermissionsResponse);

    //RPC to get User role
    rpc GetUserRole (GetUserRoleRequest) returns (GetUserRoleResponse);

    // RPC to get partner details.
    rpc GetPartnerDetails (GetPartnerDetailsRequest) returns (GetPartnerDetailsResponse);
    // RPC to get partner metadata details
    rpc GetPartnerMetaDataDetails (GetPartnerMetaDataDetailsRequest) returns (GetPartnerMetaDataDetailsResponse);
    // RPC to get partner enabled services
    rpc GetPartnerServicesDetails (GetPartnerServiceRequest) returns (GetPartnerServiceDetailsResponse);

    // RPC to get service board user details
    rpc GetServiceBoardUsersDetails(GetUsersDetailsRequest) returns (GetServiceBoardUserDetailsResponse);

    //RPC to get Partner API KEY
    rpc GetPartnerApiKey (GetPartnerApiKeyRequest) returns (GetPartnerApiKeyResponse);
}

// Context message containing metadata for the request.
message MContext {
    string correlation_id = 1; // A unique ID to correlate requests.
}

// Body message containing the main request information.
message MBody {
    string token = 1; // The JWT token to validate.
}

// The request message for token validation.
message ValidateTokenRequest {
    MContext mcontext = 1; 
    MBody mbody = 2;       
}

// Credential check for Talko login (centralized identity).
message TalkoLoginRequest {
    string credential = 1;
    string password = 2;
}

message TalkoLoginResponse {
    string message = 1;
    string user_id = 2;
    string partner_id = 3;
    string role_id = 4;
    int64 role_hierarchy = 5;
    string email = 6;
    string name = 7;
    bool is_active = 8;
}

// The response message for token validation.
message ValidateTokenResponse {
    string message = 1;              
    string correlation_id = 2;     
    bool is_active = 3;                
    string user_id = 4;            
    string session_id = 6;           
    int64 expires_in = 7;            
    string partner_id = 8;
}

// UserDetail message representing a user's directory information.
message UserDetail {
    string user_id = 1;        // User's ID.
    string email = 2;         // Email of the child user.
    bool is_active = 3;       // Indicates whether the user is active (true) or inactive (false).
    bool is_suspended = 4;    // Indicates whether the user is suspended or not.
    string name = 5;          // Full name of the user.
    string role = 6;
    int64 role_hierarchy = 7;
}

// The request message for retrieving the child user list.
message GetUserChildDetailsRequest {
    MContext mcontext = 1; // Metadata context.
    string user_id = 2;     // The current user's ID.
}

// The response message for the child user list.
message GetUserChildDetailsResponse {
    string message = 1;              // Response message.
    repeated UserDetail user_detail = 2; // Directory information of child users.
}

// The request message for retrieving child user hierarchies.
message GetUserChildHierarchyRequest {
    MContext mcontext = 1; // Metadata context.
    repeated string user_ids = 2; // List of user IDs.
}

// The response message for child user hierarchies.
message GetUserChildHierarchyResponse {
    string message = 1; // Response message.
    repeated ChildHierarchy child_hierarchy = 2; // List of child hierarchy details.
}

// Message for a single user’s child hierarchy.
message ChildHierarchy {
    string user_id = 1; // The input user ID.
    repeated string child_ids = 2; // List of child user IDs.
}


message UserProfile {
    string user_id = 1;        // User's ID.
    string name = 2;      // name of the child user.
    string email = 3;         // Email of the child user.
    string partner_id = 4;       // partner_id
    int64 role_hierarchy_level=5; //role hierarchy level
    
}

//The request for retrieving current user details
message GetUserDetailsRequest{
    MContext mcontext = 1; // Metadata context.
    string user_id =2;// The current user's ID.
}

message GetUserDetailsResponse{
    string message=1;
    UserProfile user_profile = 2; //user profile information.

}


message GetUserPermissionsRequest{
    string user_id = 1;  //user Id 
}

message GetUserPermissionsResponse{
    string message = 1;
    repeated string permissions = 2;  //List of user permission
}

message GetUserRoleRequest{
    string user_id = 1; //user_id
}

message GetUserRoleResponse{
    string message = 1;
    string role = 2;
    int64 hierarchy = 3;
}

// The response message for the child user list.
message GetServiceBoardUserDetailsResponse {
    string message = 1;              // Response message.
    repeated UserDetail user_detail = 2; // Directory information of child users.
}

// The request message for retrieving user list ids.
message GetUsersDetailsRequest {
    MContext mcontext = 1; // Metadata context.
    repeated string user_ids = 2;     // List of user's ID.
}

message GetPartnerApiKeyRequest{
    string partner_id = 1;
}

message GetPartnerApiKeyResponse{
    string api_key = 1;
}

message ServiceSubscriptionStatus {
    string status = 1;
    optional int64 entitlement_start_date = 2;
    optional int64 entitlement_end_date = 3;
    optional int64 grace_start_date = 4;       // only populated when status == "grace"
    optional int64 grace_end_date = 5;          // only populated when status == "grace"
}

// ---- Partner master (mirrors console-core; field numbers must match) ----
message GetPartnerDetailsRequest {
    MContext mcontext = 1; // Metadata context.
    string partner_id = 2;  // The partner's ID.
}

message GetPartnerDetailsResponse {
    string message = 1;              // Response message.
    PartnerDetail partner_detail = 2; // Partner information.
}

message PartnerDetail {
    string partner_id = 1;           // Partner's ID.
    string name = 2;                // Name of the partner.
    bool is_active = 3;             // Indicates whether the partner is active.
    string partner_status = 5;      // Status of the partner (enum value as string).
    string partner_logo = 6;        // URL of the partner's logo.
    int64 created_at = 7;           // Creation date of the partner.
    bool is_feedback_enabled = 10;  // Indicates whether feedback is enabled for the partner.
    bool is_publisher_onboarding_completed = 11;  // Indicates whether publisher onboarding is completed or not.
    map<string, ServiceSubscriptionStatus> subscription_status = 12;
    int64 active_license = 13;  // Active liscense of partner
    string company_legal_name = 14; // Legal company name
    string cin_no = 15;             // CIN number
    string gst_no = 16;             // GST number
}

